# Declaracao do funil comercial do CRM (Odoo) no ambiente DEV do TRE.
#
# Card: TRE-W2-E02-T01 (`t_adea8e6b`). Runbook: docs/runbooks/odoo-crm-dev.md.
#
# AS ETAPAS NAO FORAM INVENTADAS. A lista, a ordem, o ramo lateral e os dois terminais vem,
# literalmente, da secao 7.1 "Funil (estagios, dono Odoo)" do Data Contract V1.0 — documento
# CONGELADO em 29/09/2026 (card TRE-W0-E03-T01):
#
#   docs/data/DATA_CONTRACT_V1.md §7.1:
#     "Descoberto -> Pesquisado -> Qualificado -> Contato identificado -> Abordagem iniciada ->
#      Engajamento -> Reuniao -> Diagnostico -> Proposta -> Negociacao -> Won | Lost,
#      com Nurture como ramo lateral a partir de Qualificado"
#
# O que este card DECIDE (e leva para validacao do Anderson, criterio 1 do card) e apenas a
# REPRESENTACAO de cada item no Odoo — a chave `representacao` abaixo e a tabela
# "contrato x representacao" do runbook §3 tem a alternativa de cada decisao. Trocar a
# representacao e' editar este arquivo e reexecutar o configurador: nao ha codigo a mexer.

versao: funil-crm-v1
origem:
  documento: docs/data/DATA_CONTRACT_V1.md
  secao: "7.1"
  titulo_secao: "Funil (estagios, dono Odoo)"
  contrato: data-contract-v1.0
  congelado_em: "2026-09-29"

# O contrato NAO define time comercial (crm.team = pipeline no Odoo). Fica o time padrao que o
# proprio modulo cria; criar um time "Comercial Transformativa" seria invencao deste card e
# esta' fora do escopo (seria decisao do Anderson).
pipeline_padrao:
  xmlid: sales_team.team_sales_department
  # nome medido do time que o modulo cria na instancia de dev (01/10/2026). O contrato nao
  # define time; o xmlid e' a ancora de verdade e este nome e' o que o verificador espera ver.
  nome: Sales
  etapas:
    - {nome: "Descoberto",           sequencia: 10}
    - {nome: "Pesquisado",           sequencia: 20}
    - {nome: "Qualificado",          sequencia: 30}
    - {nome: "Contato identificado", sequencia: 40}
    - {nome: "Abordagem iniciada",   sequencia: 50}
    - {nome: "Engajamento",          sequencia: 60}
    - {nome: "Reunião",              sequencia: 70}
    - {nome: "Diagnóstico",          sequencia: 80}
    - {nome: "Proposta",             sequencia: 90}
    - {nome: "Negociação",           sequencia: 100}
    - {nome: "Won",                  sequencia: 110, is_won: true, representacao: etapa_com_is_won}

# Ramo lateral do contrato: sai de Qualificado. No Odoo, etapa e' linear dentro de um pipeline,
# entao um ramo lateral e' um pipeline proprio (crm.team) — assim o lead que sai do funil para
# o Nurture nao aparece como etapa do funil principal.
ramo_lateral:
  nome: Nurture
  sai_de: Qualificado
  representacao: pipeline_proprio   # alternativas: etapa_no_funil | nao_configurado
  time: Nurture
  sequencia: 10

terminais:
  - nome: Won
    representacao: etapa_com_is_won   # crm.stage com is_won=true
  - nome: Lost
    representacao: nativo_odoo        # o Odoo nao tem etapa "Lost": perda e' crm.lead.lost_reason_id
                                      # + active=false. Nenhuma etapa e' criada para Lost e
                                      # nenhum motivo de perda e' inventado aqui.

reconciliacao:
  # Etapa que nao esta' declarada acima (global ou dentro do time do funil) e' REMOVIDA.
  # Por que remover e nao arquivar: no Odoo 19 `crm.stage` NAO tem campo `active` (medido na
  # instancia de dev: campos = color, fold, is_won, name, requirements, rotting_threshold_days,
  # sequence, team_ids) — etapa nao tem estado "arquivada".
  # O que sobra do modulo `crm` sao as 3 etapas New, Qualified e Proposition (o Won e' ADOTADO:
  # o contrato pede uma etapa de ganho com esse nome e o modulo ja cria uma assim).
  # Guarda fail-closed: etapa que tenha oportunidade (crm.lead.stage_id) NAO e' removida — o
  # configurador reprova em vez de mexer em dado de negocio. Medido antes desta execucao:
  # 0 oportunidades no banco.
  # Rollback para o padrao anterior: scripts/provision/reverter-crm-dev.sh, que repoe as etapas
  # do proprio modulo com os valores literais de crm_stage_data.xml. MEDIDO em 01/10/2026:
  # `odoo -u crm` carrega o arquivo no log e NAO recria o dado apagado (o pipeline fica vazio),
  # por isso a reposicao e' explicita (scripts/provision/repor_etapas_padrao_crm.py).
  etapas_extras: remover

campos_minimos:
  # "campos minimos" do CRM basico = os campos que o proprio modulo `crm` entrega e que o funil
  # precisa para operar. Campo CUSTOMIZADO em crm.lead/res.partner e' escopo de
  # TRE-W2-E04-T01/T02 — nao deste card.
  modelo: crm.lead
  campos: [name, partner_id, stage_id, expected_revenue, probability, user_id, team_id,
           date_deadline, description, active]
