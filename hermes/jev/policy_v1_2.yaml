# =====================================================================================
# jev-policy-v1.2 — política de decisão do JEV (System-1 Decision Layer)
#
# ESTADO: EM VIGOR. Homologada pelo Anderson em 30/09/2026 (Telegram: "homologado, de
#   acordo"; registro em docs/operations/registro-de-aprovacoes.md) e executada pelo
#   roteador `jev-router-v1.2` desde 30/09/2026 — o portão de versão está aberto.
#   Ela (1) APOSENTA o classificador de card e (2) declara a lane por código canônico de
#   ação (`lane_por_codigo_de_acao`).
#   * a versão em vigor é UMA SÓ: esta. A jev-policy-v1.1 fica PRESERVADA PARA AUDITORIA
#     (congelada e ainda executável, porque o recibo guarda `policy_version`);
#   * por que aposentar: medição do card TRE-W0-E04-T03-D01 (corpus v1.4). O classificador
#     mede 0,1875 isolado e 0,375 no total — EMPATADO com a constante estrutural "sempre
#     high". Estimador que empata com a constante não é fonte de lane: é ruído calibrado.
#     Pior: por casar TEXTO, ele mandava para `critical` um card que apenas DIZIA "sem
#     credencial, nada de produção" — a ressalva virava acusação;
#   * a lane passa a ser DECLARADA nesta política, por código canônico. O roteador não
#     estima lane e não guarda lane literal (é o que o D07/D08 proíbem: trocar o YAML tem
#     de mudar a decisão);
#   * cobertura obrigatória: o mapa tem de cobrir TODOS os códigos comuns do roteador.
#     Código sem lane declarada ABSTÉM — ausência de resposta é abstinência, nunca
#     permissão silenciosa (regra do `fallback`/`proibido` da v1.1, que segue valendo);
#   * o mapa nasce CONSERVADOR (todos em `high`): é literalmente a conclusão da medição
#     acima. Ajuste por código entra em versão seguinte, com dado de custo e latência.
#
# Autoridade: docs/architecture/jev-decision-policy-v1.2.md (este arquivo é a forma
# legível por máquina; os dois têm de dizer a mesma coisa, e o verificador prova isso).
# =====================================================================================
versao: jev-policy-v1.2
estado: em-vigor
substitui: jev-policy-v1.1
congelada_em: "2026-09-30"   # congelamento é consequência da homologação + do executor implementado
autoridade: docs/architecture/jev-decision-policy-v1.2.md
origem_no_baseline: "docs 13 e 14 do baseline V1.1.0 + decisão do dono de 30/09/2026 (aposentar o classificador)"
motivo_da_versao:
  - "aposentadoria do classificador de card (decisão do Anderson, 30/09/2026, Telegram: \"sim, autorizo\"): a lane deixa de ser estimada por casamento de palavras"
  - "`lane_por_codigo_de_acao`: a lane passa a ser DECLARADA na política, por código canônico comum — fonte única, auditável, trocável só por versão nova"
  - "mapa inicial CONSERVADOR (todos os códigos comuns em `high`), porque é o que a medição sustenta: o classificador empatava com a constante \"sempre high\"; ajuste por código exige dado e vem em versão seguinte"
  - "cobertura obrigatória do mapa contra `CODIGOS_DE_ACAO_COMUNS` do roteador: código sem lane declarada abstém (ausência de resposta é abstinência)"
  - "`lanes.*.exemplos` passa a LINHA DE BASE do benchmark (`scripts/benchmark_roteamento.py`): continua versionado para reproduzir a medição que justificou a aposentadoria, e não decide nada"
homologacao:
  estado: aprovada
  registrada_em: "2026-09-30"
  registrada_por: "Anderson Ribeiro"
  registro: docs/operations/registro-de-aprovacoes.md
  o_que_faltava: "abertura do portão de versão — roteador `jev-router-v1.2` implementando `lane_por_codigo_de_acao` e caminho padrão apontado para este arquivo; feito em 30/09/2026, na mesma entrega do card TRE-W0-E04-T09"

