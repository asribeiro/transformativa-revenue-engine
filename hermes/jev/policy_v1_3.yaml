# =====================================================================================
# jev-policy-v1.3 — política de decisão do JEV (System-1 Decision Layer)
#
# ESTADO: RASCUNHO NÃO HOMOLOGADO. Entregue pelo card TRE-W0-E04-T10 para a decisão do
#   dono; a homologação é DELE. Enquanto esta versão é rascunho, a versão EM VIGOR
#   continua sendo a jev-policy-v1.2, e é ela que o roteador carrega por padrão
#   (`CAMINHO_POLITICA_PADRAO` → `hermes/jev/policy_v1_2.yaml`). Declarar suporte NÃO é
#   entrar em vigor (mesma sequência da v1.1 e da v1.2).
#
#   O que esta versão muda: UMA entrada no mapa de lane por código canônico —
#   `execucao_de_card` (execução genérica de card de DESENVOLVIMENTO), com escopo ESTREITO
#   declarado pelo dono (Anderson Ribeiro, 30/09/2026, Telegram): ambiente de
#   desenvolvimento, SEM produção e SEM credencial. Um código só foi autorizado; nomear
#   outros por conveniência NÃO foi autorizado. O resto do contrato é o da v1.1/v1.2,
#   restatado neste arquivo e no documento — nada mais mudou.
#
#   * a versão em vigor é UMA SÓ: hoje a v1.2. Esta v1.3 fica em RASCUNHO até a
#     homologação; as anteriores (v1.0 e v1.1) seguem PRESERVADAS PARA AUDITORIA
#     (congeladas e ainda executáveis, porque o recibo guarda `policy_version`);
#   * a lane declarada do código novo vem do mesmo julgamento que o mapa da v1.2: o valor
#     é `high`, o piso que a medição do card TRE-W0-E04-T03-D01 sustenta (o classificador
#     empatava com a constante estrutural "sempre high"). Nenhum ajuste de valor entra sem
#     dado de custo e latência — e ajuste de valor exige versão nova;
#   * o piso por ambiente da v1.1 é MANTIDO sem alteração de valor: a regra SÓ ELEVA, nunca
#     rebaixa, e ambiente vivo = `critical` com aprovação humana registrada. O código novo
#     NÃO cria exceção a ele: card genérico de desenvolvimento que declare DDL/migration em
#     ambiente vivo continua subindo para `critical` com aprovação humana exigida;
#   * cobertura obrigatória: o mapa tem de cobrir TODOS os códigos comuns do roteador
#     (`CODIGOS_DE_ACAO_COMUNS`) — agora CINCO. Código sem lane declarada ABSTÉM; ausência
#     de resposta é abstinência, nunca permissão silenciosa;
#   * o código novo NÃO afrouxa o D07/D08: a falha fechada continua barrando domínio
#     sensível que o código não cobre (produção/release, credencial, dado de cliente,
#     outbound a terceiro) e a ponte de prosa continua sem poder executar.
#
# Autoridade: docs/architecture/jev-decision-policy-v1.3.md (este arquivo é a forma
# legível por máquina; os dois têm de dizer a mesma coisa, e o verificador prova isso).
# =====================================================================================
versao: jev-policy-v1.3
estado: rascunho-nao-homologado
substitui: jev-policy-v1.2
autoridade: docs/architecture/jev-decision-policy-v1.3.md
origem_no_baseline: "docs 13 e 14 do baseline V1.1.0 + decisão do dono de 30/09/2026 (nomear `execucao_de_card`, medido no card TRE-W0-E04-T03-D01)"
motivo_da_versao:
  - "nomeação do código comum `execucao_de_card` (execução genérica de card de desenvolvimento) pelo dono em 30/09/2026, com escopo estreito: dev, sem produção e sem credencial — decisão do card TRE-W0-E04-T10"
  - "motivo medido no card TRE-W0-E04-T03-D01: 21 dos 32 casos do corpus não tinham código no catálogo vigente e 18 deles são `execucao_de_card`; a lacuna retinha o próprio card que consertava a classificação"
  - "`lane_por_codigo_de_acao` ganha a entrada do código novo (`high`), mantendo o mapa conservador — o valor é o que a medição sustenta, e ajuste de valor exige dado e versão seguinte"
  - "piso por ambiente da v1.1 MANTIDO valor a valor (novo/dev = `high`; vivo/produção = `critical` com aprovação humana registrada): a regra só ELEVA e o código novo não cria exceção"
  - "um código só: nomear outros códigos por conveniência NÃO foi autorizado pelo dono; a lacuna remanescente do corpus (3 casos) continua declarada como tal"
  - "a homologação é do dono: este arquivo é entregue como rascunho, com documento e verificador no rito da v1.1"
homologacao:
  estado: pendente
  registrada_em: null
  registrada_por: null
  registro: docs/operations/registro-de-aprovacoes.md
  o_que_falta: "decisão do Anderson Ribeiro (homologação) + abertura do portão de versão — `CAMINHO_POLITICA_PADRAO` apontado para este arquivo, como se fez na v1.1 (card TRE-W0-E04-T08) e na v1.2 (card TRE-W0-E04-T09). O rascunho NÃO abre o portão: quem está em vigor é a v1.2."

# ---------------------------------------------------------------------------------
