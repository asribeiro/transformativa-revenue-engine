# segue em vigor e é ela que o roteador carrega por padrão (`CAMINHO_POLITICA_PADRAO`). O
# portão de versão desta v1.3 só abre depois da homologação + do roteador que executa a
# regra declarada aqui — a mesma sequência da v1.1 (a regra declarada tem de ser a regra
