nota_da_versao: 'v1.5 (30/09/2026, card TRE-W0-E04-T10): o dono NOMEOU o codigo comum `execucao_de_card` (execucao generica de card de DESENVOLVIMENTO; escopo estreito — sem producao e sem credencial) e os 18 casos cujo rotulo `acao` E esse codigo passam a declarar `acao_codigo: execucao_de_card` (criterio (a) do T03-D01: o codigo so vem da propria declaracao do caso, nunca da prosa). Os 3 casos que seguem sem codigo no catalogo (borda-06 concessao de credencial, borda-07 ajuste de interface, borda-10 resposta a cliente) continuam `acao_codigo: null` explicito e recebem so a marca de reavaliacao. Nenhum `lane_esperada` foi alterado (30 em bloco + 2 individuais de 29/09/2026 preservados, provado por comparacao profunda campo a campo) e nenhum campo protegido mudou. O codigo novo NAO afrouxa o escopo: card que declare dominio sensivel (producao, credencial, dado de cliente) continua NAO EXECUTAVEL por falha fechada do D07, e o piso por ambiente continua elevando — provado por comportamento em scripts/verificar_jev_policy_v1_3.py (parte 5).'
