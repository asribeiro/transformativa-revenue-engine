nota_da_versao: 'v1.4 (30/09/2026, card TRE-W0-E04-T03-D01): campo `acao_codigo` anotado NOS 32 CASOS a partir do catalogo canonico vigente (os 4 codigos comuns do roteador + as 8 acoes de `nunca_decidido_por_maquina` da jev-policy-v1.1), com proveniencia caso a caso no campo nota. 11 casos declaram codigo (5 comuns, 6 proibidos); 21 casos declaram `acao_codigo: null` explicito, porque a acao NAO TEM codigo no catalogo vigente (18 deles sao `execucao_de_card`, execucao generica de card de desenvolvimento, para a qual nao existe codigo comum — nomear um codigo novo e decisao do dono, nao deste card). Criterio de atribuicao declarado no cabecalho de scripts/anotar_codigos_de_acao_no_corpus.py: o codigo so vem da propria declaracao do caso (o rotulo `acao` E o codigo, ou os sinais do caso + a regra declarada da politica identificam a operacao), NUNCA da prosa da justificativa. Nenhum `lane_esperada` foi alterado (30 em bloco + 2 individuais de 29/09/2026 preservados, provado por comparacao profunda campo a campo) e nenhum campo protegido mudou. Efeito na medicao (rodada de 30/09/2026, corpus v1.4 x v1.3): `codigo_de_acao` no recibo passa de 4/32 para 11/32, `pode_executar` de 2/32 para 4/32, escalacao cai e a medicao passa a separar EXECUTAVEL (com codigo comum) de NAO EXECUTAVEL (acao proibida ou sem codigo) — a lane de um caso sem codigo e a lane conservadora de AUDITORIA, nao uma decisao de roteamento.'
