# Odoo Community no ambiente HOMOLOG do TRE (VPS Contabo `vmi3619453`).
#
# Provisionado a partir do desenho de ambientes (decisao D5, 05/10/2026) e derivado do
# deploy/compose/dev/odoo.yml para nao divergir por digitacao. Runbook: docs/runbooks/odoo-prod.md.
#
# Regras que este arquivo carrega (e que o verificador cobra item a item):
#   * nenhum segredo aqui: o PostgreSQL le `POSTGRES_*` de /etc/tre/odoo-prod/pg.env e o Odoo
#     le `admin_passwd`/`db_password` de /etc/tre/odoo-prod/odoo.conf — os dois 600 na VPS,
#     fora do artefato publicado (politica de secrets V1, docs/operations/gestao-de-secrets.md);
#   * nenhuma porta publica: o Odoo publica SO em 127.0.0.1 (loopback) e o PostgreSQL do Odoo
#     nao publica porta nenhuma — fala pela rede interna `tre-odoo-prod`. Exposicao publica e
#     card proprio (TRE-W2-E01-T02, TLS/proxy);
#   * banco do Odoo SEPARADO (no dev e' separado do `sales_intelligence`; producao tem banco de
#     vendas PROPRIO desde o berco — ver deploy/compose/prod/pg-sales.yml e prod.env): container (`pg-odoo-prod`), volume
#     (`pgdata-odoo-prod`) e banco (`odoo_prod`) proprios;
#   * versao e porta sao OBRIGATORIAS e vem do par nao-secreto versionado
#     (deploy/environments/prod-odoo.env): sem ele `docker compose config` FALHA em vez de
#     subir "a ultima de hoje" — a identidade do que esta no ar e o digest registrado la.
#
# VERSAO ESCOLHIDA (card TRE-W2-E01-T01, registrada aqui E no par): Odoo Community **19.0**,
# digest do manifesto `sha256:77bac5cd1e065210828f34883a7f76740b7373d06dd3a5a55d3eeb31ee2f85cd`
# (medido no pull em 01/10/2026). O valor vive em deploy/environments/prod-odoo.env
# (`ODOO_VERSION`/`ODOO_DIGEST_ESPERADO`) e e conferido pelo verificador item a item; a
# ratificacao do dono esta pendente para producao — ver docs/runbooks/odoo-dev.md §1.
#
# Uso na VPS (a partir da copia do ambiente em /opt/tre/prod/compose/):
#   docker compose --env-file /opt/tre/prod/compose/odoo.env -f /opt/tre/prod/compose/odoo.yml up -d
name: tre-odoo-prod

services:
  pg-odoo-prod:
    image: postgres:16
    container_name: pg-odoo-prod
    restart: unless-stopped
    env_file:
      - /etc/tre/odoo-prod/pg.env
    volumes:
      - pgdata-odoo-prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - odoo-prod

  odoo-prod:
    image: odoo:${ODOO_VERSION:?defina ODOO_VERSION em deploy/environments/prod-odoo.env}
    container_name: odoo-prod
    restart: unless-stopped
    depends_on:
      pg-odoo-prod:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ODOO_HTTP_PORT:?defina ODOO_HTTP_PORT em deploy/environments/prod-odoo.env}:8069"
    volumes:
      - odoo-data-prod:/var/lib/odoo
      - /etc/tre/odoo-prod/odoo.conf:/etc/odoo/odoo.conf:ro
      # addons do repo chegam pelo caminho publicado (o Odoo de producao enxerga o modulo
      # `transformativa_sales_ai` quando ele for publicado; W2/E03 em diante)
      - /opt/tre/prod/repo/odoo/addons:/mnt/extra-addons:ro
    networks:
      - odoo-prod

volumes:
  pgdata-odoo-prod:
    name: pgdata-odoo-prod
  odoo-data-prod:
    name: odoo-data-prod

networks:
  odoo-prod:
    name: tre-odoo-prod
